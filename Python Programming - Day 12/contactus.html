<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Cake Lovers Paradise</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #333;
    }
    header {
      background: #ff6f61;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }
    header h1 {
      font-size: 2.5em;
      margin: 0;
    }
    .contact-section {
      max-width: 800px;
      margin: 40px auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      padding: 30px;
    }
    .contact-section h2 {
      color: #ff6f61;
      margin-top: 0;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      margin: 10px 0 5px;
      font-weight: bold;
    }
    input, textarea {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      background: #ff6f61;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #e85c50;
    }
    .social-links {
      margin-top: 30px;
      text-align: center;
    }
    .social-links a {
      margin: 0 15px;
      text-decoration: none;
      color: #ff6f61;
      font-weight: bold;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: #ff6f61;
      color: white;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>📞 Contact Cake Lovers Paradise 📞</h1>
    <p>We’d love to hear from you!</p>
  </header>

  <section class="contact-section">
    <h2>Send Us a Message</h2>
    <form>
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name">

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email">

      <label for="message">Your Message</label>
      <textarea id="message" name="message" placeholder="Write your message here..."></textarea>

      <button type="submit">Send Message</button>
    </form>

    <div class="social-links">
      <h2>Connect With Us</h2>
      <a href="#">Facebook</a>
      <a href="#">Instagram</a>
      <a href="#">Twitter</a>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Cake Lovers Paradise | Email: info@cakelovers.com | Phone: +94 77 123 4567</p>
  </footer>
</body>
</html>
